name: Install Script

# Checks the one-line installer served at https://platypus.chat/install.sh.
# Runs only when the script (or this workflow) changes: the end-to-end job pulls
# the real published images and brings up the whole stack.
on:
  pull_request:
    branches: [main]
    paths:
      - "apps/website/public/install.sh"
      - ".github/workflows/install-script.yml"
  push:
    branches: [main]
    paths:
      - "apps/website/public/install.sh"
      - ".github/workflows/install-script.yml"

permissions:
  contents: read

concurrency:
  group: install-script-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Shellcheck
        run: shellcheck apps/website/public/install.sh

  # A value the backend would refuse must stop the installer before it writes
  # anything: a half-started install is one this script then won't re-run over.
  preflight-refusals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Refuse bad values and write nothing
        run: |
          refuses() {
            dir="$RUNNER_TEMP/refused"
            if env "$@" PLATYPUS_DIR="$dir" bash < apps/website/public/install.sh; then
              echo "expected the installer to refuse: $*" >&2
              exit 1
            fi
            test ! -e "$dir" || { echo "installer wrote $dir for: $*" >&2; exit 1; }
          }
          refuses ADMIN_PASSWORD=short
          refuses ADMIN_EMAIL=not-an-email
          refuses PLATYPUS_HOST=http://example.com
          refuses PLATYPUS_HOST=example.com:3000
          refuses PLATYPUS_DOMAIN=chat.example.com PLATYPUS_HOST=example.com
          refuses PLATYPUS_DOMAIN=https://chat.example.com
          refuses PLATYPUS_DOMAIN=chat.example.com:443

  # The HTTPS path writes different files from the plain-HTTP one. A stub
  # `docker` lets the installer finish without pulling images, so this checks
  # what it writes rather than whether the stack starts.
  caddy-install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install with a domain, without starting the stack
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          cat > "$bin/docker" <<'STUB'
          #!/usr/bin/env bash
          case "$*" in
            "compose version --short") echo "2.24.0" ;;
            "compose version") echo "Docker Compose version v2.24.0" ;;
            "info") exit 0 ;;
            "volume inspect"*) exit 1 ;;
            "compose up"*) exit 0 ;;
            *) exit 0 ;;
          esac
          STUB
          chmod +x "$bin/docker"
          PATH="$bin:$PATH" PLATYPUS_DOMAIN=chat.example.com \
            PLATYPUS_DIR="$RUNNER_TEMP/platypus" bash < apps/website/public/install.sh

      - name: Assert the generated deployment
        run: |
          dir="$RUNNER_TEMP/platypus"
          grep -q '^  caddy:$' "$dir/compose.override.yaml"
          grep -q '^    image: willdady/platypus-backend:' "$dir/compose.override.yaml"
          grep -q '^    image: willdady/platypus-frontend:' "$dir/compose.override.yaml"
          test "$(grep -c 'ports: !reset \[\]' "$dir/compose.override.yaml")" = 2
          grep -q '^      chat.example.com {$' "$dir/compose.override.yaml"
          grep -q "^FRONTEND_URL='https://chat.example.com'$" "$dir/.env"
          grep -q "^BACKEND_URL='https://chat.example.com/api'$" "$dir/.env"
          grep -q "^ALLOWED_ORIGINS='https://chat.example.com'$" "$dir/.env"
          test "$(stat -c %a "$dir/.env")" = 600
          ! grep -q '^AUTH_COOKIE_DOMAIN=' "$dir/.env"
          # The real Compose validates the generated file, including !reset.
          (cd "$dir" && docker compose config >/dev/null)

  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Piped into bash, as the one-liner runs it: no stdin, no prompts.
      - name: Run the installer
        run: bash < apps/website/public/install.sh
        env:
          PLATYPUS_DIR: ${{ runner.temp }}/platypus

      - name: Assert both services are healthy
        run: |
          curl -fsS http://localhost:4000/health
          curl -fsS -o /dev/null http://localhost:3000/
          test "$(stat -c %a "$RUNNER_TEMP/platypus/.env")" = 600

      - name: Assert the generated admin credentials sign in
        run: |
          password="$(grep '^ADMIN_PASSWORD=' "$RUNNER_TEMP/platypus/.env" | cut -d"'" -f2)"
          curl -fsS -o /dev/null http://localhost:4000/auth/sign-in/email \
            -H 'Origin: http://localhost:3000' -H 'Content-Type: application/json' \
            -d "{\"email\":\"admin@example.com\",\"password\":\"$password\"}"

      - name: Backend logs
        if: failure()
        working-directory: ${{ runner.temp }}/platypus
        run: docker compose logs backend
