name: CI

# Lint and tests run twice: on every PR into main as the pre-merge gate, and on
# main itself after every push. The PR run catches problems at the merge
# boundary, before release-please and the release/deploy workflows ever see the
# code, and is enforced as a required status check so nothing merges without it.
#
# The push run is what verifies main itself, and it exists because a green PR is
# not a promise about the branch it lands on. Two PRs can each pass alone and
# break together, and a change can reach main without a PR at all — the ruleset
# lets a repository admin bypass both the pull request and this check, which is
# how a security fix lands from a private advisory. Neither case is visible to a
# pull_request trigger. Nothing gates on the push run; it is there to fail
# loudly on main so the next person is not debugging someone else's merge.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

# Cancel superseded runs for the same ref (e.g. a new push to a PR branch).
# Never on main: each merge is a distinct commit that release and deploy may be
# cut from, so cancelling an in-flight run would leave that commit unverified
# with nothing to say so.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Skip on release-please's release PR: it only bumps the version and
  # changelog (no source changes), so lint/test would re-run on code that
  # already passed. Skipped jobs feed the `gate` job below — the single required
  # check — so the release PR stays mergeable without doing redundant work.
  lint:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    uses: ./.github/workflows/lint.yml

  test:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  # Source-level type gate (`tsc --noEmit`). ESLint does not surface type errors,
  # so without this a strict-tsconfig violation can land on main unnoticed
  # (see #233). Covers every package exposing a `typecheck` script, test files
  # included; others join by adding one.
  typecheck:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  # Single required status check. Runs always (even when the upstream jobs are
  # skipped on release PRs), so the required context is always reported. Passes
  # when every job succeeded or was skipped; fails otherwise. Branch protection
  # requires only this `gate` context — keying it to the reusable `lint` job's
  # nested name (`lint / lint`) breaks when that job is skipped, since the
  # context collapses to `lint` and the required check never reports.
  gate:
    needs: [lint, test, typecheck]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify lint, typecheck & test passed (or were skipped)
        run: |
          echo "lint=${{ needs.lint.result }} test=${{ needs.test.result }} typecheck=${{ needs.typecheck.result }}"
          if [[ "${{ needs.lint.result }}" == "failure" || "${{ needs.lint.result }}" == "cancelled" || \
                "${{ needs.test.result }}" == "failure" || "${{ needs.test.result }}" == "cancelled" || \
                "${{ needs.typecheck.result }}" == "failure" || "${{ needs.typecheck.result }}" == "cancelled" ]]; then
            echo "CI gate failed"
            exit 1
          fi
          echo "CI gate passed"
