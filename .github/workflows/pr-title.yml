name: PR Title

# `main` squash-merges with the PR title as the commit subject, and
# release-please reads only those subjects: a title it can't parse ships with no
# changelog entry or version bump. Kept out of ci.yml because it needs `edited`
# (so retitling re-runs the check without a push), which there would re-run the
# whole gate on every title or body edit.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    runs-on: ubuntu-latest
    steps:
      # Scope is optional, so release-please's `chore(main): release …` passes.
      - name: Check the title is a Conventional Commit subject
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
