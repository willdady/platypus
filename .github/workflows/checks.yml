name: Checks

# Reusable verification gate: lint + Prettier check, tests, and typecheck.
# Called by CI as the merge gate, and by every workflow that ships something
# (build-and-push, deploy-docs, deploy-website, publish-sdk) so it verifies the
# exact SHA it publishes — see ci.yml for why a green PR doesn't cover that.
on:
  workflow_call:

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

  test:
    runs-on: ubuntu-latest
    # why: the .pg tests prove the last-admin Organization row lock with two
    # connections contending for it, which single-connection PGlite cannot show
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: platypus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The frontend runs under coverage, so its thresholds (vitest.config.ts)
      # gate the merge; every other package runs its plain `test`.
      - name: Test
        run: pnpm exec turbo run test --filter='!@platypus/frontend'

      - name: Test frontend with coverage
        run: pnpm exec turbo run test:coverage --filter=@platypus/frontend

      # why: these need a real Postgres and are excluded from `pnpm test`
      - name: Prove the last-admin Organization row lock
        run: pnpm --filter @platypus/backend test:pg
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/platypus

  # Source-level type gate (`tsc --noEmit`). ESLint does not surface type errors,
  # so without this a strict-tsconfig violation can land on main unnoticed
  # (see #233). Covers every package exposing a `typecheck` script, test files
  # included; others join by adding one.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck
