name: Build and Push Docker Images

on:
  release:
    types: [published]
  # The release trigger cannot be exercised without cutting a release. A dry run
  # builds both images on their native runners and stops short of Docker Hub.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build every image natively but push nothing and skip the manifest merge
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Gate: lint must pass before any image is built or pushed.
  lint:
    uses: ./.github/workflows/lint.yml

  # Each architecture builds on its own native runner. Emulating arm64 under
  # QEMU made `pnpm install` run silently for 10+ minutes and releases were
  # cancelled as hung (#932). Every job pushes by digest; the merge job below
  # joins the two digests into one multi-arch manifest and applies the tags.
  build:
    needs: lint
    strategy:
      matrix:
        image: [frontend, backend]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build ${{ matrix.image }} for linux/${{ matrix.arch }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=willdady/platypus-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=${{ !inputs.dry_run }}

      - name: Export digest
        if: ${{ !inputs.dry_run }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [frontend, backend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Get version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      # The floating major tag (`:2`) moves forward with every release in its
      # line, so a deployment can pin a major and still take minors and patches.
      # A prerelease never claims one: `:2` must not resolve to 2.0.0-rc.1.
      # `imagetools create` does not drop an empty `-t` the way build-push-action
      # did, so the output carries the whole flag and is empty for a prerelease.
      - name: Derive floating major tag
        id: tags
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: willdady/platypus-${{ matrix.image }}
        run: |
          if [[ "$VERSION" == *-* ]]; then
            echo "Prerelease $VERSION — no floating major tag."
            echo "major=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "major=-t $IMAGE:${VERSION%%.*}" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            -t willdady/platypus-${{ matrix.image }}:latest \
            -t willdady/platypus-${{ matrix.image }}:${{ steps.version.outputs.version }} \
            ${{ steps.tags.outputs.major }} \
            $(printf 'willdady/platypus-${{ matrix.image }}@sha256:%s ' *)

      - name: Inspect the published manifest
        run: docker buildx imagetools inspect willdady/platypus-${{ matrix.image }}:${{ steps.version.outputs.version }}
