services:
  database:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - platypus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 5s
      retries: 5

  backend:
    image: willdady/platypus-backend:latest
    env_file: .env
    environment:
      NODE_OPTIONS: "--disable-warning=ExperimentalWarning"
      PORT: "4000"
      DATABASE_URL: postgres://postgres:mypassword@database:5432/postgres
      BETTER_AUTH_URL: "${BACKEND_URL}"
    volumes:
      - ./data:/data
    ports:
      - "4000:4000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - platypus-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    image: willdady/platypus-frontend:latest
    env_file: .env
    environment:
      INTERNAL_BACKEND_URL: http://backend:4000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - platypus-network

volumes:
  postgres_data:

networks:
  platypus-network:
    driver: bridge
